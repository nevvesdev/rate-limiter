services:
  rate-limiter:
    build: .
    container_name: rate-limiter-java
    ports:
      - "8080:8080"
    environment:
      - RATE_LIMITER_ALGORITHM=token-bucket
      - RATE_LIMITER_CAPACITY=10
      - RATE_LIMITER_REFILL_RATE_PER_SECOND=5
      - RATE_LIMITER_WINDOW_SIZE_MILLIS=60000
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped